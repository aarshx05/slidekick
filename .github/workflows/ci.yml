name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/slidekick/scripts/requirements.txt
      - run: pip install -r skills/slidekick/scripts/requirements.txt pytest
      - name: Install Chromium
        run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # PowerPoint isn't available on hosted runners: tests marked `powerpoint` are skipped automatically
      - run: python -m pytest -v

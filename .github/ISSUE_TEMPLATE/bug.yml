name: Bug report
description: Something in /slidekick didn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked for, what you got, and what you expected.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`deck.py doctor` output"
      description: Run `python <skill-dir>/scripts/deck.py doctor` and paste the output.
      render: text
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex, Cursor, opencode, Gemini CLI / Antigravity, Other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: If you can, attach `qa/report.md`, `qa/contact-sheet.png` or the deck (remove anything confidential first).
